name: Installer

# Builds d3d8.dll and packages it with the NSIS installer configured in cmake/Packaging.cmake
# (which finds Gunlok through the registry and libraryfolders.vdf rather than asking), then
# uploads the installer .exe as a workflow artifact - so a PR touching the native build or the
# packaging itself always produces something installable to sanity-check, without publishing
# anywhere.
#
# Spelled out twice rather than shared with a YAML anchor, same as the other workflows here:
# GitHub's workflow parser accepts anchors but does not document them, and a parse failure here
# means the workflow never runs at all.
#
# Needs Windows: CMakeLists.txt stops with FATAL_ERROR anywhere but 32-bit Windows. Unlike
# docs.yml's cpp-api job, which only configures to get compile_commands.json, this runs a real
# build - it pays the full vcpkg-install cost every run the binary cache doesn't cover, and the
# toolchain setup below (slangc, a pinned clang-cl) is duplicated from that job rather than
# factored out, for the same anchor reason as above.
#
# Release, not the Ninja Multi-Config default of Debug - this file's own build section is
# explicit that Debug is for hook/correctness work and never what ships.
#
# Both GKPLUS_RENDERDOC_INTEGRATION and GKPLUS_COPY_DLL are turned off for the same reason
# docs.yml's cpp-api job turns them off: each does a REQUIRED find_package against something
# only a developer's own machine has (RenderDoc under Program Files, Steam's registry key), and
# neither has anything to do with producing an installer - GKPLUS_COPY_DLL in particular is a
# different, dev-machine-only way of getting the DLL into a Gunlok install (see CLAUDE.md's
# build section); it has nothing to do with cmake/Packaging.cmake, which needs no Steam
# `find_package` at configure time at all - its own registry/VDF lookup only runs later, inside
# the installer, on whatever machine eventually runs it.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'huffman/**'
      - 'imgui-quickjs/**'
      - 'ports/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'LICENSE'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'huffman/**'
      - 'imgui-quickjs/**'
      - 'ports/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'LICENSE'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded build is worth nothing.
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than "whatever the runner image ships", and matched to docs.yml's cpp-api
  # job rather than picked independently - both jobs build this project against vcpkg, and
  # divergent pins would mean each is proving a different dependency set works.
  #
  # vcpkg.json sets no builtin-baseline, so this commit is what decides the dependency
  # versions.
  VCPKG_COMMIT: '908da3a305a0a8028d9602ab241b433652b3df69'
  SLANG_VERSION: '2026.16'
  LLVM_VERSION: '22.1.0'

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # vcpkg reads these two to reach the Actions cache; they are not exported to `run`
      # steps by default.
      - name: Enable the vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # CMakeLists.txt stops with FATAL_ERROR without slangc.
      - name: Install slangc
        shell: pwsh
        run: |
          $url = "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/slang-$env:SLANG_VERSION-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile slang.zip
          Expand-Archive slang.zip -DestinationPath "$env:RUNNER_TEMP\slang"
          "$env:RUNNER_TEMP\slang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # cmake/clang-toolchain.cmake builds with clang-cl specifically. The official installer
      # is NSIS-based and silent under `/S`, installing to `C:\Program Files\LLVM` by default.
      - name: Install a pinned LLVM (clang-cl)
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-installer.exe"
          Start-Process "$env:RUNNER_TEMP\llvm-installer.exe" -ArgumentList "/S" -Wait
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The repo's own `builtin-vcpkg` preset expects vcpkg at ./vcpkg.
      - name: Fetch vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach $env:VCPKG_COMMIT
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: >
          cmake --preset builtin-vcpkg
          -DGKPLUS_RENDERDOC_INTEGRATION=OFF
          -DGKPLUS_COPY_DLL=OFF

      - name: Build
        run: cmake --build build --config Release

      # NSIS ships on the windows-latest runner image but is not on PATH - the same thing
      # a developer's own machine needs (see the Build section of CLAUDE.md), just already
      # installed here instead of something this job has to fetch.
      - name: Package the installer
        shell: pwsh
        working-directory: build
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          cpack -G NSIS -C Release

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: GkPlus-installer
          path: build/GkPlus-*.exe
          retention-days: 14
