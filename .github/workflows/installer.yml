name: Installer

# Builds d3d8.dll and packages it with the NSIS installer configured in cmake/Packaging.cmake
# (which finds Gunlok through the registry and libraryfolders.vdf rather than asking), then
# uploads the installer .exe as a workflow artifact - so a PR touching the native build or the
# packaging itself always produces something installable to sanity-check, without publishing
# anywhere.
#
# Spelled out twice rather than shared with a YAML anchor, same as the other workflows here:
# GitHub's workflow parser accepts anchors but does not document them, and a parse failure here
# means the workflow never runs at all.
#
# Needs 32-bit Windows as its *target* (CMakeLists.txt stops with FATAL_ERROR anywhere else),
# but not as its *host*: this runs on ubuntu-latest, cross-compiling with clang-cl + lld-link
# against a real MSVC CRT/Windows SDK sysroot fetched by `xwin` (cmake/xwin-toolchain.cmake,
# the `x86-windows-static-md-xwin` triplet) - the same clang-cl frontend `cmake/clang-toolchain.cmake`
# uses for the Windows-hosted dev build, just pointed at a fetched sysroot instead of a real
# Visual Studio install. This replaced a windows-latest job that downloaded and silently
# installed a ~500MB LLVM Windows installer and chocolatey's NSIS package; here the same tools
# are `apt-get install clang lld nsis` and a couple of tarball fetches, and the runner itself
# bills at 1x instead of 2x. Every step below - the full vcpkg dependency set (including the
# custom overlay ports), the Slang shader pipeline, the final d3d8.dll link, and `cpack -G NSIS`
# itself - was verified end to end before this file was rewritten to use it, not assumed from
# the toolchain working in isolation.
#
# Two real, cross-compilation-only build failures live behind the fixes now baked into
# cmake/xwin-toolchain.cmake and the ports/ overlays - see those files' own comments for what
# each one actually was (a missing -msse2 default, a stray CMAKE_FIND_ROOT_PATH gap, an
# upstream libspng bug that only shows up when host and target disagree). None of them are
# specific to this workflow; they would bite any project built this way.
#
# Unlike docs.yml's cpp-api job, which only configures to get compile_commands.json, this runs
# a real build - it pays the full vcpkg-install cost every run the binary cache doesn't cover.
#
# Release, not the Ninja Multi-Config default of Debug - this file's own build section is
# explicit that Debug is for hook/correctness work and never what ships. It is also the only
# config this toolchain can produce at all right now: `xwin` does not fetch the debug CRT's
# static import libs (msvcrtd.lib and friends), so a Debug-config link fails before it gets
# anywhere near this project's own code - cmake/vcpkg-triplets/x86-windows-static-md-xwin.cmake
# restricts vcpkg itself to release-only for the same reason.
#
# Both GKPLUS_RENDERDOC_INTEGRATION and GKPLUS_COPY_DLL are turned off for the same reason
# docs.yml's cpp-api job turns them off: each does a REQUIRED find_package against something
# only a developer's own machine has (RenderDoc under Program Files, Steam's registry key), and
# neither has anything to do with producing an installer - GKPLUS_COPY_DLL in particular is a
# different, dev-machine-only way of getting the DLL into a Gunlok install (see CLAUDE.md's
# build section); it has nothing to do with cmake/Packaging.cmake, which needs no Steam
# `find_package` at configure time at all - its own registry/VDF lookup only runs later, inside
# the installer, on whatever machine eventually runs it.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'huffman/**'
      - 'imgui-quickjs/**'
      - 'ports/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'LICENSE'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'huffman/**'
      - 'imgui-quickjs/**'
      - 'ports/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'LICENSE'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded build is worth nothing.
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than "whatever the runner image ships", and matched to docs.yml's cpp-api
  # job rather than picked independently.
  #
  # vcpkg.json sets no builtin-baseline, so this commit is what decides the dependency
  # versions.
  VCPKG_COMMIT: '908da3a305a0a8028d9602ab241b433652b3df69'
  SLANG_VERSION: '2026.16'
  # The prebuilt Linux x86_64 xwin binary - not the CRT/SDK sysroot it fetches, which is
  # cached separately below and has no version of its own beyond whatever xwin's manifest
  # resolves to on the day the cache is populated.
  XWIN_VERSION: '0.10.0'

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # vcpkg reads these two to reach the Actions cache; they are not exported to `run`
      # steps by default.
      - name: Enable the vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # clang-cl is a driver mode of ordinary clang, not a separate binary - Ubuntu's clang
      # package just does not symlink the name. llvm-20 is where llvm-lib/llvm-rc (the
      # toolchain's static-lib archiver and .rc compiler) actually live - not clang-20 or
      # lld-20, which is easy to miss since apt happens to pull it in as a dependency of
      # either anyway, but this is explicit rather than relying on that. python3-venv is
      # dear-bindings' own build step (it sets up a venv to run its code generator); nsis
      # provides `makensis` for the final packaging step; pkg-config is a
      # `vcpkg_fixup_pkgconfig()` dependency several ports hit.
      - name: Install the Linux build toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-20 lld-20 llvm-20 pkg-config python3-venv nsis
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-20 /usr/local/bin/lld-link

      # xwin supplies the real Microsoft CRT/Windows SDK headers and import libs clang-cl needs
      # to reproduce MSVC's ABI - see cmake/xwin-toolchain.cmake for why that specifically (and
      # not mingw-w64) is what keeps this codebase's struct/vtable mirroring correct. x86 only:
      # this project is 32-bit-only. The splat output itself is cached below rather than the
      # xwin binary's own small download cache, since it is the ~800MB that is actually worth
      # not repeating.
      - name: Fetch xwin
        run: |
          curl -sL "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o xwin.tar.gz
          tar xzf xwin.tar.gz
          echo "$PWD/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Cache the xwin sysroot
        id: xwin-cache
        uses: actions/cache@v4
        with:
          path: xwin-root
          key: xwin-root-${{ env.XWIN_VERSION }}-x86

      - name: Splat the xwin sysroot
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: xwin --accept-license --arch x86 splat --output xwin-root

      # CMakeLists.txt stops with FATAL_ERROR without slangc.
      - name: Install slangc
        run: |
          curl -sL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" \
            -o slang.tar.gz
          mkdir -p slang
          tar xzf slang.tar.gz -C slang
          echo "$PWD/slang/bin" >> "$GITHUB_PATH"

      # The repo's own `builtin-vcpkg-xwin` preset expects vcpkg at ./vcpkg.
      - name: Fetch vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: >
          cmake --preset builtin-vcpkg-xwin
          -DGKPLUS_RENDERDOC_INTEGRATION=OFF
          -DGKPLUS_COPY_DLL=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Package the installer
        working-directory: build
        run: cpack -G NSIS -C Release

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: GkPlus-installer
          path: build/GkPlus-*.exe
          retention-days: 14
