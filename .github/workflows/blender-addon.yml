name: Blender addon

# Packages blender/io_scene_rif as the installable extension zip
# (blender/tools/build_zip.py) and uploads it as a workflow artifact, so a PR
# touching the addon always produces something installable to sanity-check,
# without publishing anywhere.
#
# Spelled out twice rather than shared with a YAML anchor, same as
# types-package.yml and docs.yml: GitHub's workflow parser accepts anchors but
# does not document them, and a parse failure here means the workflow never
# runs at all.

on:
  push:
    branches: [main]
    paths:
      - 'blender/**'
      - '.github/workflows/blender-addon.yml'
  pull_request:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-addon.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded package build is worth nothing.
concurrency:
  group: blender-addon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'

      # Proves the addon half is still clean before it ships - same role
      # types-package.yml's tsc step plays ahead of npm pack.
      - name: Lint
        working-directory: blender
        run: uv run --group dev ruff check .

      - name: Build the extension zip
        working-directory: blender
        run: uv run tools/build_zip.py

      - name: Upload the extension zip
        uses: actions/upload-artifact@v4
        with:
          name: io_scene_rif
          path: blender/dist/*.zip
          retention-days: 14
